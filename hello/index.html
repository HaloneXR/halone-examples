  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello</title>
    <style>
      body { margin: 0; padding: 32px; background: #12161f; color: #e8ecf4; font: 22px system-ui, sans-serif; }
